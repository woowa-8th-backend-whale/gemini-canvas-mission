<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>바로 영어 Pro - 원어민 표현 복습하기</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase Libraries -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
      import {
        getAuth,
        signInWithCustomToken,
        signInAnonymously,
        onAuthStateChanged,
      } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
      import {
        getFirestore,
        collection,
        doc,
        setDoc,
        addDoc,
        query,
        onSnapshot,
        orderBy,
        deleteDoc,
        serverTimestamp,
      } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

      // Global State & Config
      const apiKey = ""; // Gemini API Key
      const firebaseConfig = JSON.parse(__firebase_config);
      const appId =
        typeof __app_id !== "undefined" ? __app_id : "baro-english-pro";

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);

      // App State
      let currentUser = null;
      let recognition;
      let isRecording = false;
      let currentOutputMode = "both";
      let currentVoice = "Leda";
      let currentInputMethod = "voice"; // 'voice' or 'text'
      let lastTranslatedText = "";
      let cachedAudio = { url: null, voice: null, text: null, element: null };
      let progressAnimId = null;

      // DOM Elements
      const micBtn = document.getElementById("micBtn");
      const textInputArea = document.getElementById("textInputArea");
      const textInput = document.getElementById("textInput");
      const inputDisplay = document.getElementById("inputDisplay");
      const outputDisplay = document.getElementById("outputDisplay");
      const statusIndicator = document.getElementById("statusIndicator");
      const progressCircle = document.getElementById("progressCircle");
      const replayBtn = document.getElementById("replayBtn");
      const toast = document.getElementById("toast");
      const selectedVoiceName = document.getElementById("selectedVoiceName");
      const historyList = document.getElementById("historyList");

      // --- Authentication & Initialization ---
      const initApp = async () => {
        try {
          if (
            typeof __initial_auth_token !== "undefined" &&
            __initial_auth_token
          ) {
            await signInWithCustomToken(auth, __initial_auth_token);
          } else {
            await signInAnonymously(auth);
          }
        } catch (error) {
          console.error("Auth failed", error);
        }
      };

      onAuthStateChanged(auth, (user) => {
        currentUser = user;
        if (user) {
          showToast("클라우드 동기화 활성화됨");
          loadHistory();
        }
      });

      // --- Firestore History Logic ---
      const saveToHistory = async (korean, english, voice) => {
        if (!currentUser) return;
        try {
          const historyRef = collection(
            db,
            "artifacts",
            appId,
            "users",
            currentUser.uid,
            "history",
          );
          await addDoc(historyRef, {
            korean,
            english,
            voice,
            timestamp: serverTimestamp(),
          });
        } catch (error) {
          console.error("Save failed", error);
        }
      };

      const loadHistory = () => {
        if (!currentUser) return;
        const historyRef = collection(
          db,
          "artifacts",
          appId,
          "users",
          currentUser.uid,
          "history",
        );
        onSnapshot(
          historyRef,
          (snapshot) => {
            const items = [];
            snapshot.forEach((doc) =>
              items.push({ id: doc.id, ...doc.data() }),
            );
            items.sort(
              (a, b) =>
                (b.timestamp?.seconds || 0) - (a.timestamp?.seconds || 0),
            );
            renderHistory(items);
          },
          (error) => {
            console.error("History sync error", error);
          },
        );
      };

      const deleteHistoryItem = async (id) => {
        if (!currentUser) return;
        try {
          await deleteDoc(
            doc(
              db,
              "artifacts",
              appId,
              "users",
              currentUser.uid,
              "history",
              id,
            ),
          );
          showToast("삭제되었습니다.");
        } catch (error) {
          showToast("삭제 실패");
        }
      };

      const renderHistory = (items) => {
        if (items.length === 0) {
          historyList.innerHTML = `<div class="text-center py-10 text-slate-400 text-sm">저장된 표현이 없습니다.<br>공부를 시작해보세요!</div>`;
          return;
        }

        historyList.innerHTML = items
          .map(
            (item) => `
          <div class="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm space-y-2 group transition-all hover:border-blue-200">
            <div class="flex justify-between items-start">
              <span class="text-[10px] font-bold text-blue-500 uppercase tracking-tighter">Native Expression</span>
              <button onclick="window.deleteItem('${item.id}')" class="opacity-0 group-hover:opacity-100 text-slate-300 hover:text-red-400 transition-opacity">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                </svg>
              </button>
            </div>
            <div class="text-lg font-bold text-slate-800 leading-snug">${item.english}</div>
            <div class="text-xs text-slate-500">${item.korean}</div>
            <div class="pt-2 flex items-center justify-between">
              <button onclick="window.quickReplay('${item.english.replace(/'/g, "\\'")}', '${item.voice}')" class="flex items-center space-x-1 text-xs font-bold text-blue-600 hover:text-blue-800">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3" fill="currentColor" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                <span>다시 듣기</span>
              </button>
              <span class="text-[9px] text-slate-300 font-medium">${item.timestamp ? new Date(item.timestamp.seconds * 1000).toLocaleDateString() : "Saving..."}</span>
            </div>
          </div>
        `,
          )
          .join("");
      };

      // --- Core App Logic (Translation & TTS) ---
      const processTranslation = async (text) => {
        if (!text.trim()) return;
        startLoadingUI();
        const prompt =
          "Act as an expert English translator. Convert the following Korean into a very natural, modern, native-level English expression. Provide only the translated English sentence, no explanations.";
        try {
          const result = await fetchWithRetry(
            `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`,
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                contents: [{ parts: [{ text: text }] }],
                systemInstruction: { parts: [{ text: prompt }] },
              }),
            },
          );

          lastTranslatedText =
            result.candidates?.[0]?.content?.parts?.[0]?.text?.trim() || "";

          if (currentOutputMode !== "voice")
            outputDisplay.textContent = lastTranslatedText;
          else outputDisplay.textContent = "🔊 원어민 표현 재생 중...";

          saveToHistory(text, lastTranslatedText, currentVoice);

          if (currentOutputMode === "voice" || currentOutputMode === "both") {
            await speakText(lastTranslatedText);
          } else {
            replayBtn.classList.remove("hidden");
            finishLoadingUI();
          }
        } catch (error) {
          outputDisplay.textContent = "번역 중 오류가 발생했습니다.";
          finishLoadingUI();
        }
      };

      const speakText = async (text, forceVoice = null) => {
        if (!text) return;
        const activeVoice = forceVoice || currentVoice;

        if (
          cachedAudio.url &&
          cachedAudio.text === text &&
          cachedAudio.voice === activeVoice
        ) {
          cachedAudio.element.currentTime = 0;
          cachedAudio.element.play();
          return;
        }

        try {
          const result = await fetchWithRetry(
            `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${apiKey}`,
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                contents: [
                  { parts: [{ text: `Say this naturally: ${text}` }] },
                ],
                generationConfig: {
                  responseModalities: ["AUDIO"],
                  speechConfig: {
                    voiceConfig: {
                      prebuiltVoiceConfig: { voiceName: activeVoice },
                    },
                  },
                },
              }),
            },
          );

          const audioData =
            result.candidates[0].content.parts[0].inlineData.data;
          const sampleRate =
            parseInt(
              result.candidates[0].content.parts[0].inlineData.mimeType.split(
                "rate=",
              )[1],
            ) || 24000;

          const binaryString = window.atob(audioData);
          const bytes = new Uint8Array(binaryString.length);
          for (let i = 0; i < binaryString.length; i++)
            bytes[i] = binaryString.charCodeAt(i);

          const blob = new Blob([createWavFile(bytes.buffer, sampleRate)], {
            type: "audio/wav",
          });
          if (cachedAudio.url) URL.revokeObjectURL(cachedAudio.url);

          const url = URL.createObjectURL(blob);
          cachedAudio = {
            url,
            voice: activeVoice,
            text,
            element: new Audio(url),
          };
          cachedAudio.element.play();
          replayBtn.classList.remove("hidden");
          if (currentOutputMode === "voice") outputDisplay.textContent = text;
        } catch (error) {
          showToast("음성 생성 실패");
        } finally {
          finishLoadingUI();
        }
      };

      // --- Helper Functions ---
      async function fetchWithRetry(url, options, retries = 5, backoff = 1000) {
        for (let i = 0; i < retries; i++) {
          try {
            const response = await fetch(url, options);
            if (!response.ok) throw new Error("API Error");
            return await response.json();
          } catch (err) {
            if (i === retries - 1) throw err;
            await new Promise((r) => setTimeout(r, backoff * Math.pow(2, i)));
          }
        }
      }

      function createWavFile(pcmData, sampleRate) {
        const header = new ArrayBuffer(44);
        const view = new DataView(header);
        const writeString = (v, o, s) => {
          for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i));
        };
        writeString(view, 0, "RIFF");
        view.setUint32(4, 36 + pcmData.byteLength, true);
        writeString(view, 8, "WAVE");
        writeString(view, 12, "fmt ");
        view.setUint32(16, 16, true);
        view.setUint16(20, 1, true);
        view.setUint16(22, 1, true);
        view.setUint32(24, sampleRate, true);
        view.setUint32(28, sampleRate * 2, true);
        view.setUint16(32, 2, true);
        view.setUint16(34, 16, true);
        writeString(view, 36, "data");
        view.setUint32(40, pcmData.byteLength, true);
        const wav = new Uint8Array(header.byteLength + pcmData.byteLength);
        wav.set(new Uint8Array(header), 0);
        wav.set(new Uint8Array(pcmData), 44);
        return wav;
      }

      // --- UI Management ---
      window.selectVoice = (voiceId, displayName) => {
        currentVoice = voiceId;
        selectedVoiceName.textContent = displayName;
        document
          .querySelectorAll(".voice-card")
          .forEach((c) => c.classList.remove("selected"));
        document.getElementById(`v-${voiceId}`).classList.add("selected");
        if (cachedAudio.element) cachedAudio.element.pause();
        showToast(`${displayName} 캐릭터 선택됨`);
      };

      window.setMode = (mode) => {
        currentOutputMode = mode;
        document
          .querySelectorAll(".mode-btn")
          .forEach((b) => b.classList.remove("active"));
        document.getElementById(`mode-${mode}`).classList.add("active");
      };

      window.setInputMethod = (method) => {
        currentInputMethod = method;
        document
          .querySelectorAll(".input-method-btn")
          .forEach((b) => b.classList.remove("active"));
        document.getElementById(`im-${method}`).classList.add("active");

        if (method === "voice") {
          micBtn.classList.remove("hidden");
          textInputArea.classList.add("hidden");
        } else {
          micBtn.classList.add("hidden");
          textInputArea.classList.remove("hidden");
          textInput.focus();
        }
      };

      window.handleTextSubmit = () => {
        const text = textInput.value.trim();
        if (text) {
          inputDisplay.textContent = `한국어 입력: "${text}"`;
          processTranslation(text);
          textInput.value = "";
        }
      };

      textInput.onkeypress = (e) => {
        if (e.key === "Enter") window.handleTextSubmit();
      };

      window.deleteItem = (id) => deleteHistoryItem(id);
      window.quickReplay = (text, voice) => speakText(text, voice);
      window.replayAudio = () => speakText(lastTranslatedText);

      function startLoadingUI() {
        cancelAnimationFrame(progressAnimId);
        statusIndicator.style.opacity = "1";
        statusIndicator.classList.add("loading-active");
        let start = null;
        function animate(timestamp) {
          if (!start) start = timestamp;
          const progress = Math.min((timestamp - start) / 2500, 0.92);
          progressCircle.style.strokeDashoffset = 100 - progress * 100;
          if (progress < 0.92) progressAnimId = requestAnimationFrame(animate);
        }
        progressAnimId = requestAnimationFrame(animate);
      }

      function finishLoadingUI() {
        cancelAnimationFrame(progressAnimId);
        progressCircle.style.strokeDashoffset = "0";
        setTimeout(() => {
          statusIndicator.style.opacity = "0";
          statusIndicator.classList.remove("loading-active");
          setTimeout(
            () => (progressCircle.style.strokeDashoffset = "100"),
            300,
          );
        }, 400);
      }

      const showToast = (msg) => {
        toast.textContent = msg;
        toast.style.opacity = "1";
        setTimeout(() => (toast.style.opacity = "0"), 2000);
      };

      // --- STT Setup ---
      const initRecognition = () => {
        const SpeechRecognition =
          window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) return null;
        const rec = new SpeechRecognition();
        rec.lang = "ko-KR";
        rec.onstart = () => {
          isRecording = true;
          micBtn.classList.add("mic-active");
          inputDisplay.textContent = "듣고 있습니다...";
          outputDisplay.textContent = "";
          replayBtn.classList.add("hidden");
        };
        rec.onresult = async (e) => {
          const transcript = e.results[0][0].transcript;
          inputDisplay.textContent = `한국어 입력: "${transcript}"`;
          await processTranslation(transcript);
        };
        rec.onend = () => {
          isRecording = false;
          micBtn.classList.remove("mic-active");
        };
        return rec;
      };

      recognition = initRecognition();
      micBtn.onclick = () =>
        isRecording ? recognition.stop() : recognition.start();

      initApp();
    </script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap");
      body {
        font-family: "Pretendard", sans-serif;
        background-color: #f8fafc;
        overflow-x: hidden;
      }
      .mic-active {
        animation: pulse 1.5s infinite;
        background-color: #ef4444 !important;
      }
      @keyframes pulse {
        0% {
          transform: scale(1);
          box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4);
        }
        70% {
          transform: scale(1.1);
          box-shadow: 0 0 0 15px rgba(239, 68, 68, 0);
        }
        100% {
          transform: scale(1);
          box-shadow: 0 0 0 0 rgba(239, 68, 68, 0);
        }
      }
      .glass-card {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.2);
      }
      .progress-ring__circle {
        transition: stroke-dashoffset 0.1s linear;
        transform: rotate(-90deg);
        transform-origin: 50% 50%;
        stroke-linecap: round;
      }
      .loading-active {
        animation: shadow-pulse 1.5s infinite;
      }
      @keyframes shadow-pulse {
        0%,
        100% {
          filter: drop-shadow(0 0 2px rgba(37, 99, 235, 0.2));
        }
        50% {
          filter: drop-shadow(0 0 8px rgba(37, 99, 235, 0.5));
        }
      }
      .mode-btn.active,
      .input-method-btn.active {
        background-color: #2563eb;
        color: white;
        border-color: #2563eb;
      }
      .voice-card {
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        cursor: pointer;
        border: 2px solid transparent;
      }
      .voice-card.selected {
        border-color: #2563eb;
        background-color: #eff6ff;
        transform: translateY(-2px);
      }
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 10px;
      }
    </style>
  </head>
  <body
    class="min-h-screen flex flex-col items-center justify-start py-8 px-4 sm:py-12"
  >
    <div class="max-w-xl w-full space-y-8">
      <header class="text-center space-y-2">
        <h1 class="text-4xl font-black text-blue-600 tracking-tight">
          바로 영어 Pro
        </h1>
        <p class="text-slate-500 font-medium text-lg">
          한국어로 말하면 즉시 원어민 표현으로
        </p>
      </header>

      <div class="glass-card rounded-[2.5rem] p-8 shadow-2xl space-y-8">
        <!-- 캐릭터 설정 -->
        <div class="space-y-4">
          <div class="flex justify-between items-end px-1">
            <label
              class="text-xs font-bold text-slate-400 uppercase tracking-wider"
              >캐릭터 설정</label
            >
            <span id="selectedVoiceName" class="text-xs font-bold text-blue-600"
              >엠마 (Emma)</span
            >
          </div>
          <div class="grid grid-cols-2 gap-4" id="voiceGrid">
            <div
              onclick="selectVoice('Leda', '엠마 (Emma)')"
              id="v-Leda"
              class="voice-card selected p-4 rounded-2xl bg-white shadow-sm border border-slate-100 flex items-center space-x-3"
            >
              <div class="text-3xl">👩‍💼</div>
              <div class="overflow-hidden">
                <div class="font-bold text-sm text-slate-800">엠마</div>
                <div class="text-[10px] text-slate-500 italic truncate">
                  친절하고 명확한
                </div>
              </div>
            </div>
            <div
              onclick="selectVoice('Despina', '소피아 (Sophia)')"
              id="v-Despina"
              class="voice-card p-4 rounded-2xl bg-white shadow-sm border border-slate-100 flex items-center space-x-3"
            >
              <div class="text-3xl">🙋‍♀️</div>
              <div class="overflow-hidden">
                <div class="font-bold text-sm text-slate-800">소피아</div>
                <div class="text-[10px] text-slate-500 italic truncate">
                  밝고 에너제틱한
                </div>
              </div>
            </div>
            <div
              onclick="selectVoice('Charon', '제임스 (James)')"
              id="v-Charon"
              class="voice-card p-4 rounded-2xl bg-white shadow-sm border border-slate-100 flex items-center space-x-3"
            >
              <div class="text-3xl">👨‍💼</div>
              <div class="overflow-hidden">
                <div class="font-bold text-sm text-slate-800">제임스</div>
                <div class="text-[10px] text-slate-500 italic truncate">
                  신뢰감 있고 지적인
                </div>
              </div>
            </div>
            <div
              onclick="selectVoice('Puck', '루카스 (Lucas)')"
              id="v-Puck"
              class="voice-card p-4 rounded-2xl bg-white shadow-sm border border-slate-100 flex items-center space-x-3"
            >
              <div class="text-3xl">👦</div>
              <div class="overflow-hidden">
                <div class="font-bold text-sm text-slate-800">루카스</div>
                <div class="text-[10px] text-slate-500 italic truncate">
                  장난기 넘치는 소년
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- 출력 및 입력 방식 -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div class="space-y-2">
            <label
              class="text-[10px] font-bold text-slate-400 uppercase tracking-wider ml-1"
              >출력 방식</label
            >
            <div class="grid grid-cols-3 gap-1 p-1 bg-slate-100 rounded-xl">
              <button
                onclick="setMode('text')"
                id="mode-text"
                class="mode-btn py-2 px-1 rounded-lg text-[10px] font-bold transition-all text-slate-600"
              >
                텍스트
              </button>
              <button
                onclick="setMode('voice')"
                id="mode-voice"
                class="mode-btn py-2 px-1 rounded-lg text-[10px] font-bold transition-all text-slate-600"
              >
                음성
              </button>
              <button
                onclick="setMode('both')"
                id="mode-both"
                class="mode-btn py-2 px-1 rounded-lg text-[10px] font-bold transition-all text-slate-600 active"
              >
                동시
              </button>
            </div>
          </div>
          <div class="space-y-2">
            <label
              class="text-[10px] font-bold text-slate-400 uppercase tracking-wider ml-1"
              >입력 모드</label
            >
            <div class="grid grid-cols-2 gap-1 p-1 bg-slate-100 rounded-xl">
              <button
                onclick="setInputMethod('voice')"
                id="im-voice"
                class="input-method-btn py-2 px-1 rounded-lg text-[10px] font-bold transition-all text-slate-600 active"
              >
                🎤 말하기
              </button>
              <button
                onclick="setInputMethod('text')"
                id="im-text"
                class="input-method-btn py-2 px-1 rounded-lg text-[10px] font-bold transition-all text-slate-600"
              >
                ⌨️ 타이핑
              </button>
            </div>
          </div>
        </div>

        <!-- 메인 출력 박스 -->
        <div
          class="bg-slate-50 rounded-[2rem] border border-slate-100 shadow-inner relative h-[220px] flex flex-col"
        >
          <div class="absolute top-6 right-6 flex items-center space-x-4 z-10">
            <div
              id="statusIndicator"
              class="relative w-10 h-10 opacity-0 transition-opacity duration-300"
            >
              <svg class="w-full h-full" viewBox="0 0 36 36">
                <circle
                  class="text-slate-200"
                  stroke-width="3"
                  stroke="currentColor"
                  fill="transparent"
                  r="16"
                  cx="18"
                  cy="18"
                />
                <circle
                  id="progressCircle"
                  class="text-blue-600 progress-ring__circle"
                  stroke-width="3"
                  stroke-dasharray="100"
                  stroke-dashoffset="100"
                  stroke="currentColor"
                  fill="transparent"
                  r="16"
                  cx="18"
                  cy="18"
                />
              </svg>
            </div>
            <button
              id="replayBtn"
              onclick="replayAudio()"
              class="hidden p-3 bg-white shadow-lg rounded-full text-blue-600 hover:bg-blue-50 transition-all active:scale-90 border border-slate-100"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="h-6 w-6"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"
                />
              </svg>
            </button>
          </div>
          <div class="p-8 overflow-y-auto flex-1">
            <div
              id="inputDisplay"
              class="text-[11px] text-blue-500 mb-4 font-bold uppercase tracking-widest pr-16 break-words"
            ></div>
            <div
              id="outputDisplay"
              class="text-2xl font-bold text-slate-800 leading-tight pr-12 break-words"
            >
              <span class="text-slate-300 italic font-medium"
                >말하거나 입력하면 즉시 번역됩니다.</span
              >
            </div>
          </div>
        </div>

        <!-- 입력 제어 (말하기/타이핑 전환) -->
        <div class="flex justify-center min-h-[96px]">
          <!-- 마이크 버튼 (기본) -->
          <button
            id="micBtn"
            class="w-24 h-24 bg-blue-600 rounded-[3rem] flex items-center justify-center text-white shadow-2xl shadow-blue-200 transition-all active:scale-95 hover:bg-blue-700"
          >
            <svg
              id="micIcon"
              xmlns="http://www.w3.org/2000/svg"
              class="h-10 w-10"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"
              />
            </svg>
          </button>

          <!-- 텍스트 입력 영역 (전환 시 표시) -->
          <div
            id="textInputArea"
            class="hidden w-full flex items-center space-x-2 animate-in fade-in slide-in-from-bottom-2 duration-300"
          >
            <input
              type="text"
              id="textInput"
              placeholder="한국어로 입력하세요..."
              class="flex-1 bg-slate-100 border-none rounded-2xl px-6 py-5 text-slate-700 font-bold focus:ring-2 focus:ring-blue-500 outline-none transition-all shadow-inner"
            />
            <button
              onclick="handleTextSubmit()"
              class="p-5 bg-blue-600 text-white rounded-2xl shadow-lg hover:bg-blue-700 active:scale-90 transition-all"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="h-6 w-6"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M13 5l7 7-7 7M5 5l7 7-7 7"
                />
              </svg>
            </button>
          </div>
        </div>
      </div>

      <!-- 학습 히스토리 -->
      <div class="space-y-6">
        <div class="flex items-center justify-between px-2">
          <h2 class="text-xl font-bold text-slate-800">나의 학습 히스토리</h2>
          <span
            class="px-3 py-1 bg-blue-100 text-blue-600 text-[10px] font-bold rounded-full uppercase tracking-wider"
            >Cloud Synced</span
          >
        </div>
        <div id="historyList" class="space-y-4">
          <div class="text-center py-10">
            <div class="animate-pulse text-slate-300">
              데이터를 동기화 중입니다...
            </div>
          </div>
        </div>
      </div>

      <p
        class="text-center text-slate-400 text-[10px] font-bold uppercase tracking-widest pb-12"
      >
        Advanced Native Expression Engine & Cloud
      </p>
    </div>

    <div
      id="toast"
      class="fixed bottom-10 left-1/2 -translate-x-1/2 px-6 py-3 bg-slate-900 text-white text-sm rounded-2xl opacity-0 transition-opacity duration-300 pointer-events-none z-50 shadow-2xl"
    >
      알림
    </div>
  </body>
</html>
